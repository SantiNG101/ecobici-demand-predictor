[project]
name = "ecobici-demand-predictor"
version = "0.1.0"
description = "Modelo predictivo de demanda de Ecobici (CABA): adquisición, EDA, transformaciones, modelado y despliegue"
readme = "README.md"
requires-python = ">=3.12,<3.14"  # shap 0.54.1 (la 0.54.0 fue retirada) pide 3.12
dependencies = [
    # Datos (los cuatro notebooks). pandas fijado: es la versión con la que se ejecutaron los notebooks
    "pandas==2.3.3",
    "numpy>=1.26,<3",
    "duckdb>=1.1",
    "pyarrow>=14",
    "requests>=2.31",
    # Gráficos y EDA (02, 03)
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "missingno>=0.5",
    "folium>=0.17",
    # Calendario (02)
    "holidays>=0.50",
    # Normalización (03) y modelos (04)
    "scikit-learn==1.9.1",  # los .joblib de models/ sólo se garantizan con esta versión
    "shap>=0.54",  # notebook 05
    # Para abrir y ejecutar los notebooks
    "jupyter",
    # API e interfaz (cuarto entregable)
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "streamlit==1.67.0",
    "pydeck==0.9.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
# Es un proyecto de notebooks, no un paquete instalable
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
